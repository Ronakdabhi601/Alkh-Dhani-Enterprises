name: Build Alkh Dhani Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Alkh_Dhani_Enterprises_Android_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses and install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: |
          mkdir app-project
          unzip Alkh_Dhani_Enterprises_Android_Project.zip -d app-project

      - name: Build debug APK
        working-directory: app-project
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alkh-dhani-enterprises-debug-apk
          path: app-project/app/build/outputs/apk/debug/app-debug.apk
